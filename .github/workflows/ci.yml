name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Restore
        run: dotnet restore MikeMacro.slnx
      - name: Build
        run: dotnet build MikeMacro.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test MikeMacro.slnx --no-build --configuration Release --verbosity normal